name: lich_hop_app
description: "Hệ thống Quản lý Lịch họp – Ủy ban nhân dân (Flutter)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Bản dịch sẵn có trong SDK – dùng cho hộp chọn ngày/giờ tiếng Việt
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^12.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
